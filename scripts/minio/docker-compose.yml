# MinIO for local Mountpoint integration tests (Docker Compose only).
services:
  minio:
    image: minio/minio:latest
    container_name: mountpoint-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      # Official image includes curl in recent tags; start.sh also polls from the host.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One-shot bucket bootstrap (re-run: docker compose run --rm create-buckets)
  create-buckets:
    image: minio/mc:latest
    container_name: mountpoint-minio-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mountpoint-test || true &&
      mc mb -p local/mountpoint-test-2 || true &&
      mc ls local/
      "
    restart: "no"

volumes:
  minio-data:
